<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Lattice compact vertical graph editor wireframe</title>
  <desc id="desc">Dark gridless canvas with compact top-input bottom-output nodes, a left Library and Property Editor, and a right evaluation trace panel.</desc>
  <defs>
    <style>
      text { font-family:'Segoe UI',Arial,sans-serif; fill:#eef0ef; font-size:12px; }
      .title { font-size:14px; font-weight:600; } .small { font-size:10px; fill:#b7bbba; }
      .section { font-size:12px; font-weight:600; } .tiny { font-size:9px; fill:#d3d7d5; }
      .panel { fill:#272727; stroke:#3e3e3e; stroke-width:1; }
      .button { fill:#343535; stroke:#555757; stroke-width:1; }
      .field { fill:#393b3b; stroke:#717575; stroke-width:1; }
      .node { fill:#3a3a3a; stroke:#a0a3a2; stroke-width:1.3; }
      .edge { fill:none; stroke:#9b9f9e; stroke-width:1.3; stroke-linecap:round; }
      .port { fill:#282828; stroke:#e5e7e6; stroke-width:1.5; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".36"/></filter>
    <clipPath id="canvasClip"><rect x="302" y="37" width="875" height="862"/></clipPath>
  </defs>
  <rect width="1500" height="900" fill="#202020"/>
  <rect width="1500" height="36" fill="#282828"/>
  <line x1="0" y1="36" x2="1500" y2="36" stroke="#424242"/>
  <text x="16" y="23" class="title">≡  Lattice — Oak_Bark.shadergraph</text>
  <text x="320" y="23" class="small">MATERIAL</text>
  <text x="1251" y="23" class="small">●  저장됨</text>
  <text x="1351" y="23">▣  ⋯</text>

  <rect class="panel" x="0" y="37" width="301" height="862"/>
  <text x="18" y="67" class="section">Library</text><text x="270" y="67">☰</text>
  <rect class="field" x="17" y="84" width="267" height="28" rx="3"/>
  <text x="30" y="103" class="small">⌕  Search nodes...</text>
  <rect class="button" x="17" y="124" width="128" height="26" rx="3"/>
  <rect class="button" x="152" y="124" width="132" height="26" rx="3"/>
  <text x="59" y="142">□  New</text><text x="195" y="142">▣  Save</text>
  <rect class="button" x="17" y="157" width="267" height="26" rx="3"/>
  <text x="124" y="175">▷  Validate</text>
  <rect class="button" x="17" y="190" width="267" height="26" rx="3"/>
  <text x="125" y="208">↶  Undo</text>
  <text x="17" y="247" class="small">Nodes  ·  Material</text>
  <line x1="17" y1="258" x2="284" y2="258" stroke="#414141"/>
  <text x="24" y="283">⌄  Variables</text>
  <text x="42" y="310" class="small">Texture Parameter</text>
  <text x="42" y="333" class="small">Scalar Parameter</text>
  <text x="24" y="361">⌄  Operations</text>
  <text x="42" y="388" class="small">Texture Sample</text>
  <text x="42" y="411" class="small">Multiply</text>
  <text x="42" y="434" class="small">Normal Map</text>
  <line x1="17" y1="455" x2="284" y2="455" stroke="#414141"/>
  <text x="17" y="483" class="section">Property Editor</text>
  <text x="17" y="512" class="small">Selected node</text>
  <text x="17" y="538">Multiply</text>
  <rect x="17" y="558" width="267" height="31" rx="3" fill="#343737" stroke="#6b967b"/>
  <text x="29" y="579">☑  Node Active</text>
  <text x="17" y="616" class="small">Title</text>
  <rect class="field" x="17" y="624" width="267" height="29" rx="3"/>
  <text x="29" y="643">Multiply</text>
  <text x="17" y="679" class="small">Factor B</text>
  <rect class="field" x="17" y="688" width="267" height="29" rx="3"/>
  <text x="29" y="707">0.80</text>
  <text x="17" y="749" class="small">Input A: linked from Texture Sample</text>
  <text x="17" y="772" class="small">Output: Color</text>

  <g clip-path="url(#canvasClip)">
    <path class="edge" d="M632 190 C632 276 526 272 526 354"/>
    <path class="edge" d="M863 190 C863 278 990 273 990 354"/>
    <path class="edge" d="M526 418 C526 467 724 461 724 500"/>
    <path class="edge" d="M759 564 C759 604 676 609 676 652"/>
    <path class="edge" d="M990 418 C990 534 826 539 826 652"/>
    <circle cx="577" cy="261" r="8" fill="#ed9e2c"/><text x="574" y="265" class="tiny" fill="#151515">1</text>
    <circle cx="814" cy="257" r="8" fill="#ed9e2c"/><text x="811" y="261" class="tiny" fill="#151515">2</text>
    <circle cx="698" cy="612" r="8" fill="#ed9e2c"/><text x="695" y="616" class="tiny" fill="#151515">1</text>
    <circle cx="924" cy="536" r="8" fill="#ed9e2c"/><text x="921" y="540" class="tiny" fill="#151515">2</text>

    <g filter="url(#shadow)">
      <rect class="node" x="550" y="128" width="164" height="62" rx="3"/>
      <line x1="550" y1="153" x2="714" y2="153" stroke="#a0a3a2"/>
      <text x="559" y="146" class="section">VARIABLE</text><text x="682" y="146" class="tiny">⊙ ▷</text>
      <text x="566" y="175">Base Color Texture</text>
      <circle class="port" cx="632" cy="128" r="4"/><circle class="port" cx="632" cy="190" r="4"/>
    </g>
    <g filter="url(#shadow)">
      <rect class="node" x="782" y="128" width="164" height="62" rx="3"/>
      <line x1="782" y1="153" x2="946" y2="153" stroke="#a0a3a2"/>
      <text x="791" y="146" class="section">VARIABLE</text><text x="914" y="146" class="tiny">⊙ ▷</text>
      <text x="802" y="175">Normal Texture</text>
      <circle class="port" cx="863" cy="128" r="4"/><circle class="port" cx="863" cy="190" r="4"/>
    </g>
    <g filter="url(#shadow)">
      <rect class="node" x="442" y="354" width="169" height="64" rx="3"/>
      <line x1="442" y1="379" x2="611" y2="379" stroke="#a0a3a2"/>
      <text x="451" y="372" class="section">TEXTURE</text><text x="581" y="372" class="tiny">⊙ ▷</text>
      <text x="460" y="402">Texture Sample</text>
      <circle class="port" cx="526" cy="354" r="4"/><circle class="port" cx="526" cy="418" r="4"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="676" y="500" width="168" height="64" rx="3" fill="#3a3a3a" stroke="#8ac39b" stroke-width="2"/>
      <line x1="676" y1="525" x2="844" y2="525" stroke="#a0a3a2"/>
      <text x="686" y="518" class="section">MATH</text><text x="816" y="518" class="tiny">⊙ ▷</text>
      <text x="697" y="548">Multiply  ·  0.80</text>
      <circle class="port" cx="724" cy="500" r="4"/><circle class="port" cx="792" cy="500" r="4"/>
      <circle class="port" cx="759" cy="564" r="4"/>
    </g>
    <g filter="url(#shadow)">
      <rect class="node" x="907" y="354" width="167" height="64" rx="3"/>
      <line x1="907" y1="379" x2="1074" y2="379" stroke="#a0a3a2"/>
      <text x="918" y="372" class="section">NORMAL</text><text x="1045" y="372" class="tiny">⊙ ▷</text>
      <text x="930" y="402">Normal Map</text>
      <circle class="port" cx="990" cy="354" r="4"/><circle class="port" cx="990" cy="418" r="4"/>
    </g>
    <g filter="url(#shadow)">
      <rect class="node" x="650" y="652" width="202" height="69" rx="3"/>
      <line x1="650" y1="679" x2="852" y2="679" stroke="#a0a3a2"/>
      <text x="661" y="671" class="section">SURFACE</text><text x="820" y="671" class="tiny">⊙ ▷</text>
      <text x="669" y="704">Principled Output</text>
      <circle class="port" cx="676" cy="652" r="4"/><circle class="port" cx="826" cy="652" r="4"/>
      <circle class="port" cx="751" cy="721" r="4"/>
    </g>
  </g>
  <rect x="315" y="791" width="30" height="105" rx="3" fill="#343535" stroke="#4d4d4d"/>
  <text x="325" y="815" class="title">+</text><text x="326" y="844" class="title">−</text>
  <text x="323" y="872">⊡</text><text x="322" y="891" class="small">?</text>
  <text x="1026" y="884" class="small">100%  ·  6 nodes / 5 links</text>

  <rect class="panel" x="1178" y="37" width="321" height="862"/>
  <text x="1197" y="66" class="section">☰  Evaluation Trace</text>
  <text x="1197" y="100" class="small">Inputs (2)</text>
  <rect class="button" x="1194" y="112" width="288" height="32" rx="3"/>
  <text x="1208" y="133">›  Base Color Texture</text><text x="1455" y="133">◎</text>
  <rect class="button" x="1194" y="151" width="288" height="32" rx="3"/>
  <text x="1208" y="172">›  Normal Texture</text><text x="1455" y="172">◎</text>
  <text x="1197" y="227" class="small">Operations (3)</text>
  <rect class="button" x="1194" y="240" width="288" height="32" rx="3"/>
  <text x="1208" y="261">›  Texture Sample</text><text x="1455" y="261">◎</text>
  <rect x="1194" y="279" width="288" height="32" rx="3" fill="#424844" stroke="#82b891"/>
  <text x="1208" y="300">⌄  Multiply</text><text x="1455" y="300">◎</text>
  <rect class="button" x="1194" y="318" width="288" height="32" rx="3"/>
  <text x="1208" y="339">›  Normal Map</text><text x="1455" y="339">◎</text>
  <text x="1197" y="392" class="small">Output (1)</text>
  <rect class="button" x="1194" y="405" width="288" height="32" rx="3"/>
  <text x="1208" y="426">›  Principled Output</text><text x="1455" y="426">◎</text>
  <line x1="1194" y1="465" x2="1482" y2="465" stroke="#444"/>
  <text x="1197" y="494" class="section">Validation</text>
  <text x="1197" y="521" class="small">●  0 errors  ·  0 warnings</text>
  <text x="1197" y="550" class="small">선택한 단계에서 노드로 이동합니다.</text>
  <text x="1197" y="859" class="small">Material은 평가 추적입니다.</text>
  <text x="1197" y="880" class="small">BT/Animator에서는 실행 상태를 표시합니다.</text>
</svg>
