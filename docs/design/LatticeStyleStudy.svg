<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">Lattice style study with row anchored pins</title>
  <desc id="desc">Dark three panel editor with colored node headers, left input pins, right output pins, and typed curved wires.</desc>
  <defs>
    <linearGradient id="amber" x2="0" y2="1"><stop stop-color="#f2a21a"/><stop offset="1" stop-color="#564028"/></linearGradient>
    <linearGradient id="teal" x2="0" y2="1"><stop stop-color="#25a9ab"/><stop offset="1" stop-color="#2a444b"/></linearGradient>
    <linearGradient id="red" x2="0" y2="1"><stop stop-color="#e9504b"/><stop offset="1" stop-color="#4b3035"/></linearGradient>
    <linearGradient id="green" x2="0" y2="1"><stop stop-color="#49aa5d"/><stop offset="1" stop-color="#2b4838"/></linearGradient>
    <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#ab55ba"/><stop offset="1" stop-color="#48304d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1" dy="5" stdDeviation="5" flood-opacity=".4"/></filter>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #e8edf0; font-size: 13px; }
      .muted { fill: #a4adb1; font-size: 11px; }
      .heading { font-size: 15px; font-weight: 600; }
      .node { fill: #222e33; stroke: #5c6d72; stroke-width: 1.2; }
      .header { font-size: 14px; font-weight: 600; }
      .field { fill: #344249; stroke: #53666d; stroke-width: 1; }
      .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .panel { fill: #242a2d; stroke: #3d464a; stroke-width: 1; }
    </style>
  </defs>

