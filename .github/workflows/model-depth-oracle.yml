name: Model depth oracle

on:
  push:
    paths:
      - 'Tools/regression/verify-model-depth.py'
      - 'Tools/regression/ModelDepthOracleTests.py'
      - '.github/workflows/model-depth-oracle.yml'
  pull_request:
    paths:
      - 'Tools/regression/verify-model-depth.py'
      - 'Tools/regression/ModelDepthOracleTests.py'
      - '.github/workflows/model-depth-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth-oracle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Analytic depth and corruption regressions
        run: python Tools/regression/ModelDepthOracleTests.py
