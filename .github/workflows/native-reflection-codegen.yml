name: Regenerate native F# bindings

on:
  workflow_dispatch:
  push:
    branches: [work/fsharp-native-completion-20261029]
    paths-ignore:
      - 'Engine/Scripting/Bindings/GeneratedNative/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read exact dependency revisions
        id: reflgen
        shell: pwsh
        run: |
          $port = Get-Content ports/reflgen/portfile.cmake -Raw
          $match = [regex]::Match($port, 'REPO\s+29thnight/reflgen_cpp\s+REF\s+([0-9a-f]{40})')
          if (!$match.Success) { throw 'The engine must pin an exact reflgen commit.' }
          "revision=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "vcpkg=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: 29thnight/reflgen_cpp
          ref: ${{ steps.reflgen.outputs.revision }}
          path: Build/ReflectionDependency
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.reflgen.outputs.vcpkg }}
          path: Build/ReflectionVcpkg
      - name: Bootstrap pinned dependency manager
        shell: pwsh
        run: |
          & ./Build/ReflectionVcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate from production Windows headers and compile the result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $dependency = Join-Path $env:GITHUB_WORKSPACE 'Build/ReflectionDependency'
          $generatorBuild = Join-Path $env:RUNNER_TEMP 'ReflectionGenerator'
          cmake -S $dependency -B $generatorBuild -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -DREFLGEN_BUILD_TESTS=OFF -DREFLGEN_BUILD_EXAMPLES=OFF -DREFLGEN_BUILD_IFC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $generatorBuild --target reflgen_cli --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $generator = Join-Path $generatorBuild 'generator/reflgen.exe'
          $facades = Join-Path $env:GITHUB_WORKSPACE 'Engine/Scripting/Bindings/GeneratedNative'
          # This refresh intentionally replaces only this job's checkout. It
          # never edits declaration JSON by hand or writes a repository ref.
          python Tools/regression/verify-native-reflection-surface.py --generator $generator --reflgen-root $dependency --vcpkg (Join-Path $env:GITHUB_WORKSPACE 'Build/ReflectionVcpkg/vcpkg.exe') --configuration Debug --work (Join-Path $env:RUNNER_TEMP 'NativeReflectionSurface') --facades-output $facades
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/build/generate-fsharp-native-facades.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Tools/regression/NativeReflectionProduct/NativeReflectionProduct.Compile.fsproj -c Debug "-p:ScriptNativeGenerator=$generator" -m:1 -nr:false --nologo -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $provenance = [ordered]@{
            engineCommit = $env:GITHUB_SHA
            reflgenCommit = '${{ steps.reflgen.outputs.revision }}'
            workflowRun = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            configuration = 'Debug'
            source = 'Production Windows headers'
          }
          $provenance | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'NativeReflectionSurface/codegen-provenance.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: native-fsharp-generated
          path: Engine/Scripting/Bindings/GeneratedNative/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fsharp-codegen-evidence
          path: |
            ${{ runner.temp }}/NativeReflectionSurface/logs/
            ${{ runner.temp }}/NativeReflectionSurface/commands/
            ${{ runner.temp }}/NativeReflectionSurface/generated/
            ${{ runner.temp }}/NativeReflectionSurface/result.json
            ${{ runner.temp }}/NativeReflectionSurface/ownership.json
            ${{ runner.temp }}/NativeReflectionSurface/codegen-provenance.json
          if-no-files-found: warn
