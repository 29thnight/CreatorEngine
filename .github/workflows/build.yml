name: Build

# 컴파일 회귀를 잡기 위한 빌드 검증.
#
# 빌드 범위에 대한 참고:
#   Academy_4Q(에디터)와 Player(게임 플레이어 — 구 TrainAsis의 후계, PHASE 12
#   B0)는 FMOD 라이브러리(ThirdParty/Fmod/lib/x64/*.lib)가 저장소에 포함되지 않아
#   (.gitignore) 링크할 수 없다. 따라서 이 워크플로는 엔진 라이브러리
#   Runtime 라이브러리 4종까지만 명시적으로 빌드한다. 실제 컴파일 오류는
#   대부분 이 범위에서 잡히며,
#   실행 파일 프로젝트는 링크 단계에서만 추가 검증이 필요하다.
#   FMOD 공급이 결정되면(BuildPipelinePlan B5) exe 타깃과 게임 패키지 레그를
#   추가한다.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'docs/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # vcpkg가 필요 없는 빠른 검증. 몇 분 안에 피드백을 준다.
  include-boundary:
    name: Editor/Core 물리 경계 검사 (E0)
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: include·프로젝트 참조·소스 편입 래칫
        shell: pwsh
        run: |
          # include 방향뿐 아니라 vcxproj ProjectReference, Core의 Editor 소스
          # 편입과 ImGui/EngineMode/BUILD_FLAG 부채 증가도 함께 실패시킨다.
          python scripts/check_include_boundary.py
          if ($LASTEXITCODE -ne 0) {
            throw "Editor/Core 경계 위반 (exit code $LASTEXITCODE)"
          }

  build:
    name: 엔진 라이브러리 빌드 (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      # vcpkg가 빌드한 패키지를 이 디렉터리에 캐싱한다.
      # 첫 실행은 소스 빌드라 매우 오래 걸리지만(physx/assimp/boost 등),
      # 이후 실행은 캐시에서 복원되어 크게 단축된다.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache

    steps:
      - uses: actions/checkout@v4

      - name: MSBuild 준비
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: MSBuild host tool architecture 확인
        shell: pwsh
        run: pwsh -NoProfile -File Tools/regression/verify-msbuild-tool-architecture.ps1

      - name: vcpkg 바이너리 캐시 디렉터리 생성
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: vcpkg 바이너리 캐시 복원
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          # 포트 목록이 바뀌면 새로 빌드해야 하므로 해시를 키에 넣는다.
          key: vcpkg-${{ runner.os }}-${{ matrix.configuration }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.configuration }}-
            vcpkg-${{ runner.os }}-

      - name: vcpkg MSBuild 통합
        shell: pwsh
        run: |
          # 이 저장소의 vcxproj는 대부분 vcpkg include/lib 경로를 명시하지 않고
          # user-wide 통합에 의존한다. 로컬 개발 환경과 동일하게 맞춰준다.
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate install 실패" }

      - name: 엔진 라이브러리 빌드
        shell: pwsh
        run: |
          $targets = @(
            "Engine\Utility_Framework"
            "Engine\Physics"
            "Engine\SceneRuntime"
            "Engine\RenderEngine"
          ) -join ";"

          # Debug 레그는 유니티(점보) 빌드를 끄고 컴파일한다.
          #
          # 유니티 빌드는 여러 .cpp를 한 번역 단위로 합치므로, 앞 파일의 include가
          # 뒤 파일로 전이되어 "자기 include가 모자란 TU"가 조용히 통과한다. 그
          # 상태는 파일 이동·include 정리 때마다 무작위로 터지는 함정이었다
          # (트랩 제거 작업, 2026-08-08). 비유니티 컴파일은 모든 TU의 include
          # 자급자족을 강제한다.
          #
          # 유니티 모드 자체는 Release 레그와 로컬 개발 빌드가 상시 검증한다.
          $unityFlag = if ("${{ matrix.configuration }}" -eq "Debug") {
            "/p:EnableUnitySupport=false"
          } else { "" }

          msbuild CreatorEngine.sln `
            /t:$targets `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            $unityFlag `
            /m `
            /v:minimal `
            /nologo `
            /clp:Summary

          if ($LASTEXITCODE -ne 0) {
            throw "빌드 실패 (exit code $LASTEXITCODE)"
          }

      - name: 빌드 산출물 확인
        shell: pwsh
        run: |
          $expected = @(
            "Utility_Framework.lib"
            "Physics.lib"
            "SceneRuntime.lib"
            "RenderEngine.lib"
          )
          # E7-a(2026-08-24)부터 정적 lib는 Build\Lib\<플랫폼>-<구성>\ 한 곳이다.
          $outputDir = "Build\Lib\x64-${{ matrix.configuration }}"
          Write-Host "산출물 경로: $outputDir"

          $missing = @()
          foreach ($name in $expected) {
            $path = Join-Path $outputDir $name
            if (Test-Path $path) {
              $size = [math]::Round((Get-Item $path).Length / 1MB, 1)
              Write-Host "  OK  $name ($size MB)"
            } else {
              $missing += $name
              Write-Host "  --  $name (없음)"
            }
          }
          if ($missing.Count -gt 0) {
            throw "산출물 누락: $($missing -join ', ')"
          }
